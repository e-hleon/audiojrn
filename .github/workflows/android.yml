name: Android
on: [pull_request, workflow_dispatch]
jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Check Android privacy surface
        working-directory: .
        run: python3 scripts/check_android_privacy.py
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug compileDebugAndroidTestKotlin
      - name: Upload Room schema
        uses: actions/upload-artifact@v4
        with:
          name: room-schema
          path: android/app/schemas/**
          if-no-files-found: error
      - name: Check merged debug manifest
        working-directory: .
        run: python3 scripts/check_android_privacy.py --require-merged
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: audiojrn-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
