name: Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: audio_tfm
          POSTGRES_USER: audio_tfm
          POSTGRES_PASSWORD: audio_tfm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audio_tfm -d audio_tfm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql+psycopg://audio_tfm:audio_tfm_ci@localhost:5432/audio_tfm
          APP_TIMEZONE: UTC
        run: alembic upgrade head
      - name: Run tests without external services
        env:
          DATABASE_URL: postgresql+psycopg://audio_tfm:audio_tfm_ci@localhost:5432/audio_tfm
          APP_TIMEZONE: UTC
        run: python -m pytest -q
      - name: Run evaluation infrastructure tests
        run: python -m pytest -q tests/test_evaluation.py
