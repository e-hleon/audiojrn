services:
  api:
    build:
      context: .
      target: runtime
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-8000}:8000"
    environment:
      WHISPER_MODEL: large-v3
      WHISPER_COMPUTE_TYPE: int8_float16
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-audiojrn}:${POSTGRES_PASSWORD:-audiojrn_dev}@postgres:5432/${POSTGRES_DB:-audiojrn}}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
    volumes:
      - models:/models
    tmpfs:
      - /tmp:size=128m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      start_period: 120s
      retries: 5
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-audiojrn}
      POSTGRES_USER: ${POSTGRES_USER:-audiojrn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audiojrn_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  models:
  postgres_data:
